name: Web widget
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    name: WASM and Matrix integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Godot and single-threaded web template
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          curl -fL --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          echo 'f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011  /tmp/templates.tpz' | sha256sum -c -
          unzip -q /tmp/templates.tpz templates/web_nothreads_release.zip -d /tmp/godot
          rm /tmp/templates.tpz
      - name: Build browser game and bundled assets
        run: python3 tools/build_web.py --godot /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --template /tmp/godot/templates/web_nothreads_release.zip
      - run: npm run test:widget
      - run: npx playwright install --with-deps chromium
      - name: Test real WASM rendering and two Matrix widgets
        run: npm run test:web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-validation
          path: .artifacts/browser
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .artifacts/web
  deploy:
    name: Publish playable widget
    if: github.repository == 'dark-collective/tabletop-club' && github.event_name != 'pull_request' && github.ref == 'refs/heads/web/matrix-widget'
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

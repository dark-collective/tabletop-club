<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tabletop Club · Matrix widget</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#15131c;color:#edeaf2}*{box-sizing:border-box}body{margin:0;height:100dvh;display:flex;flex-direction:column}header{display:flex;align-items:center;gap:12px;padding:7px 12px;background:#221d30;flex-wrap:wrap;border-bottom:1px solid #473957;font-size:13px}strong{font-size:14px}#connection{color:#bcb4cb;flex:1}#controls{display:flex;gap:6px;align-items:center}button,input{font:inherit;border:1px solid #68547e;border-radius:5px;padding:5px 8px;color:inherit;background:#332842}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}input{width:6em;text-transform:uppercase}#game{flex:1;position:relative;min-height:0;overflow:hidden}canvas{width:100%;height:100%;display:block;outline:none}#loading{position:absolute;inset:0;display:grid;place-content:center;gap:18px;text-align:center;background:#15131c}#loading[hidden]{display:none}progress{width:min(70vw,360px);accent-color:#b98be7}#error{margin:0;padding:12px 16px;background:#522c39;color:#fff}#session{color:#d2b1f1;white-space:nowrap}#dismiss{border:0;background:transparent}#error:empty{display:none}@media(max-width:700px){header{gap:6px}#connection{font-size:11px}#controls{width:100%}}
</style>$GODOT_HEAD_INCLUDE</head>
<body><header><strong>Tabletop Club</strong><span id="connection">Connecting to Matrix…</span><span id="session"></span><span id="players"></span><div id="controls" hidden><button id="solo" disabled>Solo</button><button id="host" disabled>Host table</button><label><span class="code-label">Code </span><input id="room-code" aria-label="Room code" maxlength="4" autocomplete="off"></label><button id="join" disabled>Join</button><button id="save" disabled>Download save</button><button id="load" disabled>Import save</button><input id="save-file" type="file" accept=".tc" hidden></div><button id="dismiss" aria-label="Dismiss message">×</button></header>
<p id="error" role="alert" hidden></p><main id="game"><canvas id="canvas" tabindex="0" aria-label="Tabletop Club game">Your browser needs WebGL 2 to run Tabletop Club.</canvas><div id="loading"><strong id="status">Loading Tabletop Club…</strong><progress id="progress" max="1" value="0"></progress><span>Game files and saves stay in this browser.</span></div></main>
<script src="$GODOT_URL"></script><script>window.GODOT_CONFIG=$GODOT_CONFIG;</script><script type="module" src="widget.js"></script></body></html>
